name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build GpuSentinel.sln --configuration Release

      - name: Run smoke tests
        run: dotnet run --project tests/GpuSentinel.SmokeTests/GpuSentinel.SmokeTests.csproj --configuration Release --no-build

      - name: Publish portable app
        run: >-
          dotnet publish src/GpuSentinel/GpuSentinel.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/GpuSentinel-win-x64

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/GpuSentinel-win-x64/* -DestinationPath artifacts/GpuSentinel-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: GpuSentinel-win-x64
          path: artifacts/GpuSentinel-win-x64.zip
          if-no-files-found: error
